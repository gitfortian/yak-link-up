# DataGen Source -> Print Sink reference pipeline.
# Run from the repository root:
# mvn -pl link-up-launcher -am compile exec:java \
#   -Dexec.args=link-up-launcher/examples/datagen-to-print.conf
job.name = "datagen-to-print-example"

env {
  source-parallelism = 2
  sink-parallelism = 1
  channel-capacity = 64
}

source {
  type = "datagen"
  batch-size = 2
  row_count = 6
  split_count = 2
  seed = 2024
  schema = [
    { name = "id", type = "bigint", sequence_start = 1000 }
    { name = "city", type = "string", values = ["hangzhou", "shanghai"] }
    { name = "age", type = "int", min = 18, max = 60 }
  ]
}

sink {
  type = "print"
}
